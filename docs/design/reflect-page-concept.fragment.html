<div id="circle-reflect-concept" class="viz-dotted-background">
  <div class="concept-label">Layout proposal · fictional example</div>
  <div class="phone" aria-label="Circle OS Reflect concept">
    <div class="phone-camera" aria-hidden="true"></div>
    <div class="screen">
      <div class="ribbons" aria-hidden="true"></div>
      <main class="app-frame" aria-label="Reflect page">
        <div id="reflect-content"></div>
      </main>
      <nav class="bottom-nav" aria-label="Main navigation">
        <span><i data-lucide="house" aria-hidden="true"></i>Home</span>
        <span><i data-lucide="circle" aria-hidden="true"></i>Today</span>
        <span class="active" aria-current="page"><i data-lucide="blend" aria-hidden="true"></i>Reflect</span>
        <span><i data-lucide="compass" aria-hidden="true"></i>Explore</span>
      </nav>
      <div class="phone-home" aria-hidden="true"></div>
    </div>
  </div>
  <div class="sr-only" id="reflect-announcement" aria-live="polite"></div>
</div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;700&display=swap');
  #circle-reflect-concept { --c-bone:#F1EFE8; --c-ink:#191813; --c-orange:#E36B37; --c-charcoal:#403E35; padding:18px 8px 24px; }
  #circle-reflect-concept * { box-sizing:border-box; }
  #circle-reflect-concept .concept-label { text-align:center; margin-bottom:16px; font:400 12px/1.5 Geist,Arial,sans-serif; color:light-dark(#5a574f,#c7c4bb); }
  #circle-reflect-concept .phone { width:min(100%,390px); margin-inline:auto; padding:9px; border:1px solid #77746b; border-radius:48px; background:#272620; box-shadow:0 12px 35px #0003; position:relative; }
  #circle-reflect-concept .phone-camera { position:absolute; top:15px; left:50%; transform:translateX(-50%); width:88px; height:23px; border-radius:20px; background:#10100e; z-index:2; }
  #circle-reflect-concept .screen { position:relative; overflow:hidden; border-radius:39px; padding:53px 12px 13px; color:var(--c-bone); background:var(--c-ink); font-family:Geist,Arial,sans-serif; font-size:18px; line-height:1.5; isolation:isolate; }
  #circle-reflect-concept .ribbons { position:absolute; inset:-70px -90px; z-index:-1; opacity:.28; pointer-events:none; background:repeating-radial-gradient(ellipse at 3% 38%,transparent 0 11px,#E36B374f 11.7px 12px,transparent 12.7px 19px); transform:rotate(-21deg); }
  #circle-reflect-concept .app-frame { padding:24px; min-height:648px; border:1px solid #F1EFE85c; border-radius:36px; background:linear-gradient(150deg,#403E35eb,#191813f7 55%); box-shadow:inset 0 1px 1px #F1EFE84d, inset 0 -1px 0 #E36B3729,0 4px 20px #0003; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
  #circle-reflect-concept h1 { font-size:28px; font-weight:700; letter-spacing:-.015em; line-height:1.2; margin:0 0 32px; }
  #circle-reflect-concept h2 { font-size:28px; font-weight:700; letter-spacing:-.015em; line-height:1.2; margin:22px 0 24px; }
  #circle-reflect-concept p { margin:0; }
  #circle-reflect-concept button { font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; }
  #circle-reflect-concept .preview { display:block; width:100%; border:0; background:transparent; padding:0; text-align:left; border-radius:4px; }
  #circle-reflect-concept button:focus-visible { outline:2px solid var(--c-orange); outline-offset:6px; }
  #circle-reflect-concept .preview + .preview { margin-top:36px; }
  #circle-reflect-concept .preview-label { display:block; font-size:16px; line-height:1.4; font-weight:700; margin-bottom:12px; }
  #circle-reflect-concept .preview-title { display:block; font-size:18px; line-height:1.5; font-weight:700; }
  #circle-reflect-concept .preview-quote { display:block; font-size:18px; line-height:1.5; font-weight:400; }
  #circle-reflect-concept .meta { display:block; margin-top:8px; color:#c0bdb3; font-size:12px; font-weight:400; line-height:1.5; }
  #circle-reflect-concept .open-cue { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; color:var(--c-orange); font-size:16px; font-weight:400; min-height:24px; }
  #circle-reflect-concept .open-cue span:last-child { font-size:24px; line-height:1; }
  #circle-reflect-concept .bottom-nav { margin-top:16px; min-height:70px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:center; gap:4px; border:1px solid #F1EFE850; border-radius:25px; background:linear-gradient(160deg,#403E35f0,#191813); box-shadow:inset 0 1px 1px #F1EFE83d; }
  #circle-reflect-concept .bottom-nav > span { display:grid; justify-items:center; gap:5px; color:var(--c-bone); font-size:12px; font-weight:700; }
  #circle-reflect-concept .bottom-nav i,#circle-reflect-concept .bottom-nav svg { width:20px; height:20px; }
  #circle-reflect-concept .bottom-nav .active { color:var(--c-orange); }
  #circle-reflect-concept .phone-home { height:4px; width:90px; margin:16px auto 0; border-radius:4px; background:#F1EFE8a6; }
  #circle-reflect-concept .detail-header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin:-10px 0 0; }
  #circle-reflect-concept .text-action { border:0; padding:10px 0; min-height:44px; background:transparent; font-size:16px; line-height:1.4; font-weight:700; }
  #circle-reflect-concept .text-action.orange { color:var(--c-orange); }
  #circle-reflect-concept .prose { font-size:18px; font-weight:400; line-height:1.5; }
  #circle-reflect-concept .prose + .prose { margin-top:24px; }
  #circle-reflect-concept .detail-label { font-size:16px; font-weight:700; line-height:1.4; margin:32px 0 12px; }
  #circle-reflect-concept .glass-action { min-height:52px; width:100%; padding:12px 16px; border:1px solid #F1EFE869; border-radius:12px; background:linear-gradient(150deg,#605d5366,#191813); box-shadow:inset 0 1px 0 #F1EFE840,0 3px 10px #E36B3714; font-size:18px; font-weight:700; }
  #circle-reflect-concept .link-list { margin-top:24px; }
  #circle-reflect-concept .list-item { display:flex; gap:12px; justify-content:space-between; width:100%; border:0; border-bottom:1px solid #F1EFE822; padding:16px 0; background:transparent; text-align:left; font-size:18px; line-height:1.5; }
  #circle-reflect-concept .list-item span:last-child { color:var(--c-orange); }
  #circle-reflect-concept details { margin-top:32px; }
  #circle-reflect-concept summary { min-height:44px; font-size:16px; font-weight:700; color:var(--c-orange); }
  #circle-reflect-concept .question { margin-top:32px; padding-top:24px; border-top:1px solid #F1EFE833; }
  #circle-reflect-concept .empty-note { color:#c0bdb3; font-size:16px; }
  #circle-reflect-concept .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  @media(max-width:374px) { #circle-reflect-concept { padding-inline:0; } #circle-reflect-concept .phone { padding:6px; border-radius:38px; } #circle-reflect-concept .screen { padding-inline:8px; border-radius:31px; } #circle-reflect-concept .app-frame { padding:24px; border-radius:30px; } }
  @media(prefers-reduced-transparency:reduce) { #circle-reflect-concept .app-frame { background:var(--c-ink); backdrop-filter:none; -webkit-backdrop-filter:none; } }
</style>
<script>
(() => {
  const root = document.getElementById('circle-reflect-concept');
  const content = root.querySelector('#reflect-content');
  const announcement = root.querySelector('#reflect-announcement');
  const saved = window.openai?.widgetState?.privateContent;
  const state = { page:['overview','direction','discovery','reading','history'].includes(saved?.page) ? saved.page : 'overview', section:['direction','discovery','reading'].includes(saved?.section) ? saved.section : 'reading', firstVisit:!!saved?.firstVisit };
  const header = title => `<div class="detail-header"><button type="button" class="text-action" data-open="overview">‹ Back</button><button type="button" class="text-action" data-history="${title}">History</button></div>`;
  const cue = text => `<span class="open-cue"><span>${text}</span><span aria-hidden="true">›</span></span>`;
  function render() {
    root.querySelector('.app-frame').setAttribute('aria-label', state.page === 'overview' ? 'Reflect page' : state.page === 'history' ? 'Reflect history' : `${state.page} full page`);
    if (state.page === 'overview') {
      content.innerHTML = `<h1>Reflect</h1>
        <button type="button" class="preview" data-open="direction"><span class="preview-label">What matters to me</span><span class="preview-title">Find a direction</span><span class="preview-quote">I want to explore creative work.</span>${cue('My direction')}</button>
        <button type="button" class="preview" data-open="discovery"><span class="preview-label">What I’m learning</span>${state.firstVisit ? '<span class="preview-quote">What have you learned about yourself lately?</span>' : '<span class="preview-quote">“Starting feels easier when I choose one small thing.”</span><span class="meta">Your words · Nov 10</span>'}${cue(state.firstVisit ? 'Take a moment' : 'My discoveries')}</button>
        <button type="button" class="preview" data-open="reading"><span class="preview-label">Athena’s reading</span>${state.firstVisit ? '<span class="preview-quote">Your readings will appear here.</span>' : '<span class="preview-quote">You returned to drawing after a difficult day.</span><span class="meta">Nov 11</span>'}${cue(state.firstVisit ? 'About readings' : 'Read more')}</button>`;
    } else if (state.page === 'direction') {
      content.innerHTML = `${header('direction')}<h2>My direction</h2><p class="prose">Find a direction</p><p class="detail-label">What I want to explore</p><p class="prose">I want to explore creative work. Drawing is one thing I’m curious about.</p><p class="meta">Your words · Nov 8</p><details><summary>Explore your direction</summary><div class="link-list">${['Vision','Character','Mission','Typical Tuesday','Six months'].map(label => `<p class="list-item"><span>${label}</span></p>`).join('')}</div></details>`;
    } else if (state.page === 'discovery') {
      content.innerHTML = `${header('discovery')}<h2>My discoveries</h2>${state.firstVisit ? '<p class="prose">What have you learned about yourself lately?</p><p class="empty-note" style="margin-top:24px">No saved discoveries yet.</p>' : '<p class="meta" style="margin-bottom:24px">Your words · Nov 10</p><p class="prose">Starting feels easier when I choose one small thing.</p><p class="prose">Yesterday I kept putting off drawing. Today I chose to draw just one object, and getting started felt easier.</p>'}`;
    } else if (state.page === 'reading') {
      content.innerHTML = `${header('reading')}<h2>Athena’s reading</h2>${state.firstVisit ? '<p class="prose">No saved readings yet.</p><p class="prose">Future readings will begin when you ask Athena.</p>' : '<p class="meta" style="margin-bottom:24px">Nov 11 · Example reading</p><p class="prose">You returned to drawing after a difficult day. You also wrote that you were curious about creative work.</p><p class="prose">That gives you an experience to explore. It does not mean you have to choose a career in it.</p><div class="question"><p class="prose">What did you enjoy about drawing?</p></div><details><summary>View sources</summary><p class="detail-label">Your records</p><p class="prose">Log · Drawing · Nov 9 and Nov 11</p><p class="prose">My direction · Nov 8</p></details>'}`;
    } else {
      const label = state.section === 'direction' ? 'Direction history' : state.section === 'discovery' ? 'Discoveries' : 'Reading history';
      content.innerHTML = `<div class="detail-header"><button type="button" class="text-action" data-open="${state.section}">‹ Back</button></div><h2>${label}</h2>${state.firstVisit ? '<p class="prose">No earlier entries.</p>' : `<button type="button" class="list-item" data-open="${state.section}"><span>${state.section === 'direction' ? 'Find a direction' : state.section === 'discovery' ? 'Choosing a small beginning' : 'Returning to drawing'}<small class="meta">${state.section === 'direction' ? 'Nov 8' : state.section === 'discovery' ? 'Nov 10' : 'Nov 11'}</small></span><span aria-hidden="true">›</span></button>`}`;
    }
  }
  function persist() {
    window.openai?.setWidgetState?.({ modelContent:{reflectConceptView:state.page,firstVisit:state.firstVisit}, privateContent:{...state} })?.catch(() => {});
  }
  root.addEventListener('click', event => {
    const trigger = event.target.closest('button[data-open],button[data-history]');
    if (!trigger || !root.contains(trigger)) return;
    if (trigger.dataset.history) { state.section = trigger.dataset.history; state.page = 'history'; }
    else state.page = trigger.dataset.open;
    render();
    announcement.textContent = state.page === 'overview' ? 'Reflect overview' : `${state.page} opened`;
    content.querySelector('button')?.focus({preventScroll:true});
    persist();
  });
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root.querySelector('.phone'),onChange:() => { state.page='overview'; render(); persist(); }});
    tweak.addToggle(state,'firstVisit',{label:'First visit'});
  }
})();
</script>
